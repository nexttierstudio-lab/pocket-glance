<header class="bar">
  <div class="bar-in">
    <a class="brand" href="./"{{brand_current}}><img src="{{root}}img/icon-192.png" alt="" width="24" height="24">Pocket Glance</a>
    <nav class="links" aria-label="{{nav_label}}">
{{bar_links}}
    </nav>
    <div class="right">
      <details class="lang">
        <summary aria-label="{{lang_label}}: {{lang_name}}" title="{{lang_label}}"><svg class="globe" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></g></svg><span>{{lang_code}}</span><svg class="chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.75 5 6.75 8 3.75" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
        <div class="drop"><ul>{{lang_menu}}</ul>
        <div class="mode"><p class="mode-h" id="mode-h1">{{mode_label}}</p><div class="mode-row" role="group" aria-labelledby="mode-h1"><button type="button" data-mode="light" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></svg>{{mode_light}}</button><button type="button" data-mode="dark" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>{{mode_dark}}</button></div></div></div>
      </details>
      <a class="nav-cta" href="https://play.google.com/store/apps/details?id=com.nexttier.pocketglance" title="{{cta_play}}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.2 2.4c-.3.3-.4.7-.4 1.2v16.8c0 .5.1.9.4 1.2l9.5-9.6zm10.6 10.7 2.7 2.7-11.4 6.5c-.4.2-.9.3-1.2.1zm0-2.2-9.9-9.3c.3-.2.8-.1 1.2.1l11.4 6.5zm3.9 3.9-3-3 3-3 3.2 1.8c.9.5.9 1.9 0 2.4z"/></svg><span>{{nav_download}}</span><em class="soon">{{soon}}</em></a>
      <button class="burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="{{menu_open}}" data-open="{{menu_open}}" data-close="{{menu_close}}"><i></i><i></i></button>
    </div>
  </div>
  <div class="menu" id="menu">
    <a class="menu-cta" href="https://play.google.com/store/apps/details?id=com.nexttier.pocketglance"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.2 2.4c-.3.3-.4.7-.4 1.2v16.8c0 .5.1.9.4 1.2l9.5-9.6zm10.6 10.7 2.7 2.7-11.4 6.5c-.4.2-.9.3-1.2.1zm0-2.2-9.9-9.3c.3-.2.8-.1 1.2.1l11.4 6.5zm3.9 3.9-3-3 3-3 3.2 1.8c.9.5.9 1.9 0 2.4z"/></svg>{{nav_download}}<em class="soon">{{soon}}</em></a>
    <nav aria-label="{{nav_label}}">
{{bar_links}}
    </nav>
    <p class="menu-h">{{lang_label}}</p>
    <ul class="chips">{{lang_menu}}</ul>
    <div class="mode"><p class="mode-h" id="mode-h2">{{mode_label}}</p><div class="mode-row" role="group" aria-labelledby="mode-h2"><button type="button" data-mode="light" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></svg>{{mode_light}}</button><button type="button" data-mode="dark" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>{{mode_dark}}</button></div></div>
  </div>
</header>
